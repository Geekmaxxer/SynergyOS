---
title: Components
description: Removal of certain Windows components
privilege: TrustedInstaller
actions:


 - !taskKill: {name: "explorer"}
# - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Taskband', value: 'Favorites', type: REG_BINARY, data: ''}
# - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Taskband', value: 'FavoritesResolve', type: REG_BINARY, data: ''}

 # Edge
 - !taskKill: {name: "MicrosoftEdgeUpdate", option: "remove-edge"}
 - !taskKill: {name: "msedge", option: "remove-edge"}
 - !taskKill: {name: "MicrosoftEdge*", option: "remove-edge"}
 - !taskKill: {name: "setup", pathContains: "\\Edge", option: "remove-edge"}
 - !taskKill: {name: "msedgewebview2", option: "remove-edge"}
 - !service: {name: "edgeupdate", operation: delete, option: "remove-edge"}
 - !service: {name: "edgeupdatem", operation: delete, option: "remove-edge"}
 - !service: {name: "MicrosoftEdgeElevationService", operation: delete, option: "remove-edge"} 
 - !cmd: {command: '"edge.bat"', runas: trustedInstaller, exeDir: true, wait: true, option: "remove-edge"}
 - !appx: {name: 'Microsoft.MicrosoftEdge_8wekyb3d8bbwe', type: family, option: "remove-edge"}
 - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MicrosoftEdge.Stable_8wekyb3d8bbwe', operation: add, option: "remove-edge"}
 - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MicrosoftEdge_8wekyb3d8bbwe', operation: add, option: "remove-edge"}
 
 # Onedrive
 - !status: {status: 'Removing OneDrive'}
 - !taskKill: {name: "OneDriveStandaloneUpdater"}
 - !taskKill: {name: "OneDriveSetup"}
 - !taskKill: {name: "OneDrive*"}
 - !service: {name: "OneSyncSvc*", operation: delete}

 - !cmd: {command: '"oned.bat"', exeDir: true, runas: trustedInstaller, wait: true}
 - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run', value: 'OneDrive', operation: delete}
 - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run', value: 'OneDriveSetup', operation: delete}
 - !file: {path: "%windir%\\System32\\OneDriveSetup.exe"}
 - !file: {path: "%windir%\\SysWOW64\\OneDriveSetup.exe"}
 - !file: {path: "%windir%\\SysWOW64\\OneDriveSettingSyncProvider.dll"}
 - !file: {path: "%SystemDrive%\\OneDriveTemp"}
 - !file: {path: "%ProgramData%\\Microsoft OneDrive"}


 # AI mumbo jumbo
 - !scheduledTask:
    path: "\\Microsoft\\Windows\\WindowsAI\\Recall"
    operation: deleteFolder
 - !scheduledTask:
    path: "\\Microsoft\\Windows\\WindowsAI\\Settings"
    operation: deleteFolder
 - !scheduledTask:
    path: "\\Microsoft\\Windows\\WindowsAI"
    operation: deleteFolder

 - !taskKill: {name: 'ai.exe'}
 - !taskKill: {name: 'Copilot.exe'}
 - !taskKill: {name: 'aihost.exe'}
 - !taskKill: {name: 'aicontext.exe'}
 - !taskKill: {name: 'ClickToDo.exe'}
 - !taskKill: {name: 'aixhost.exe'}
 - !taskKill: {name: 'WorkloadsSessionHost.exe'}

 - !service:
    name: "WSAIFabricSvc"
