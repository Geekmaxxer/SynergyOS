  # VCRedist - downloads during OOBE after ISO injection
  - !status: {status: 'Installing VCRedist'}
  - !download: {git: 'https://github.com/abbodi1406/vcredist', regex: '^VisualCppRedist_AIO_x86_x64\.exe$', destination: '%temp%\vcredist.exe', overwrite: true, oobe: true}
  - !cmd: {command: '"%temp%\vcredist.exe" /ai /gm2', runas: currentUserElevated, wait: true, oobe: true}
  
  # 7-Zip - downloads during OOBE after ISO injection
  - !status: {status: 'Installing 7-Zip'}
  - !download: {git: 'https://github.com/ip7z/7zip', regex: '^7z.*-x64\.exe$', destination: '%temp%\7Zip.exe', overwrite: true, oobe: true}
  - !cmd: {command: '"%temp%\7Zip.exe" /S', runas: currentUserElevated, wait: true, oobe: true}
