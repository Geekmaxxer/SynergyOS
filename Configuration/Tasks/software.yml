---
title: Software 
description: Install Software
privilege: TrustedInstaller 
actions:

  # oobe: true — SOFTWARE.ps1 needs a live user session and network; runs at first boot / live run
  # Utilities - 7-Zip, Visual C++ Runtimes, DirectX
  - !status: {status: 'Installing Software'}
  - !powerShell:
      command: '.\SOFTWARE.ps1'
      exeDir: true
      wait: true
      weight: 150
      runas: currentUserElevated
      oobe: true

  # SynToolkit (optional)
  - !status: {status: 'Installing SynToolkit', option: 'syntoolkit'}
  - !powerShell:
      command: '.\SOFTWARE.ps1 -SynToolkit'
      exeDir: true
      wait: true
      weight: 100
      option: 'syntoolkit'
      runas: currentUserElevated
      oobe: true

  # Browsers
  - !status: {status: 'Installing Brave', option: 'browser-brave'}
  - !powerShell:
      command: '.\SOFTWARE.ps1 -Brave'
      exeDir: true
      wait: true
      weight: 120
      option: 'browser-brave'
      runas: currentUserElevated
      oobe: true

  - !status: {status: 'Installing Firefox', option: 'browser-firefox'}
  - !powerShell:
      command: '.\SOFTWARE.ps1 -Firefox'
      exeDir: true
      wait: true
      weight: 120
      option: 'browser-firefox'
      runas: currentUserElevated
      oobe: true

  - !status: {status: 'Installing Chrome', option: 'browser-chrome'}
  - !powerShell:
      command: '.\SOFTWARE.ps1 -Chrome'
      exeDir: true
      wait: true
      weight: 120
      option: 'browser-chrome'
      runas: currentUserElevated
      oobe: true
  # !download defaults to injection (offline cache); !cmd installs run at OOBE / live run
  - !status: {status: 'Installing .NET 8 Desktop Runtime'}
  - !download: {url: 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe', destination: '%temp%\dotnet8_desktop_x64.exe', overwrite: true, package: 'dotnet'}
  - !download: {url: 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x86.exe', destination: '%temp%\dotnet8_desktop_x86.exe', overwrite: true, package: 'dotnet'}
  - !cmd: {command: '"%temp%\dotnet8_desktop_x64.exe" /install /quiet /norestart', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\dotnet8_desktop_x86.exe" /install /quiet /norestart', runas: currentUserElevated, wait: true}
