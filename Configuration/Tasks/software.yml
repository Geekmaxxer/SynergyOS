---
title: Software 
description: Install Software
privilege: TrustedInstaller 
actions:

  # Brave - downloads during OOBE after ISO injection
  - !status: {status: 'Installing Brave', option: 'browser-brave'}
  - !download: {url: 'https://laptop-updates.brave.com/latest/winx64', destination: '%temp%\brave.exe', overwrite: true, option: 'browser-brave', oobe: true}
  - !cmd: {command: '"%temp%\brave.exe" /silent /install', runas: currentUserElevated, wait: true, option: 'browser-brave', oobe: true}
  
  # Chrome - downloads during OOBE after ISO injection
  - !status: {status: 'Installing Chrome', option: 'browser-chrome'}
  - !download: {url: 'https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi', destination: '%temp%\chrome.msi', overwrite: true, option: 'browser-chrome', oobe: true}
  - !cmd: {command: 'msiexec /i "%temp%\chrome.msi" /qn', runas: currentUserElevated, wait: true, option: 'browser-chrome', oobe: true}
  
  # Firefox - downloads during OOBE after ISO injection
  - !status: {status: 'Installing Firefox', option: 'browser-firefox'}
  - !download: {url: 'https://download.mozilla.org/?product=firefox-latest&os=win64&lang=en-US', destination: '%temp%\firefox.exe', overwrite: true, option: 'browser-firefox', oobe: true}
  - !cmd: {command: '"%temp%\firefox.exe" /S', runas: currentUserElevated, wait: true, option: 'browser-firefox', oobe: true}
  

